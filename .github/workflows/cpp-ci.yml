name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show g++ version
        run: g++ --version

      - name: Build CSV Mini Database
        run: g++ -std=c++17 src/main.cpp -o csv_db

      - name: Run smoke test
        run: |
          cat > test_commands.txt << 'EOF'
          LOAD data/students.csv
          SELECT *
          SELECT * WHERE name = 'Alice'
          SELECT name, age WHERE major = CS
          ADD 99,TestUser,30,QA,Taipei
          SELECT * WHERE id = 99
          EXIT
          EOF

          ./csv_db < test_commands.txt > output.txt
          cat output.txt

          grep -q "Alice" output.txt
          grep -q "TestUser" output.txt
          grep -q "row(s) returned" output.txt